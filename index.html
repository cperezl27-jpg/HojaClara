<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hojaclara.js</title>
    <style>
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        *, *::before, *::after{
            box-sizing: border-box;
        }
        img {
            max-width: 50px;
            height: auto;
        }
        table {
            border-collapse: collapse;
        }
        thead, tr td:first-child{
            background: #eee ;
        }
        th, td{
            border: 1px solid #ccc;
            font-weight: normal;
            font-size: 12px;
            text-align: center;
            width: 64px;
            height: 20px;
            vertical-align: middle;
            position:relative
        }

        span, input{ 
            position: absolute;
            inset: 0;
            vertical-align: middle;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        input{
            border: 0;
            opacity: 0;
            pointer-events: none;
            width: 100%;
            border-radius: 2px;

            &:focus {
                opacity: 1;
                outline: 2px solid #09f;
            }
        }
        .selected{
            background: rgb(0, 255, 17);
        }
        th.selected{
            background: rgba(50, 177, 88, 0.785);
        }
    </style>
    <script type="module">
        const $ = Element => document.querySelector(Element)
        const $$ = Element => document.querySelectorAll(Element)

        const $table = $('table')
        const $head = $('thead')
        const $body = $('tbody')

        const ROWS = 10
        const COLUMNS = 10
        const FIRST_CHAR_CODE = 65

        const times = length => Array.from({ length }, (_, i) => i)
        const getColumn = i => String.fromCharCode(FIRST_CHAR_CODE + i)

        let selectedColumn = null

        let STATE = times(COLUMNS)
          .map(i => times(ROWS).map(j => ({computedValue: 0, value: 0})))

        // Auxiliares para cálculo de referencias
        function parseCellId(cellId) {
            const letter = cellId.match(/[A-Z]+/)?.[0]
            const number = cellId.match(/\d+/)?.[0]
            if (!letter || !number) return null
            const x = letter.charCodeAt(0) - FIRST_CHAR_CODE
            const y = parseInt(number, 10) - 1
            return { x, y }
        }

        function getReferences(formula) {
            const matches = formula.match(/[A-Z]+\d+/g) || []
            return [...new Set(matches)]
        }

        // Detección previa de referencias circulares mediante DFS
        function hasCircularReference(startId, currentId, state, visited = new Set()) {
            if (visited.has(currentId)) return false
            visited.add(currentId)

            const pos = parseCellId(currentId)
            if (!pos || pos.x < 0 || pos.x >= COLUMNS || pos.y < 0 || pos.y >= ROWS) return false

            const cellValue = String(state[pos.x][pos.y].value)
            if (!cellValue.startsWith('=')) return false

            const refs = getReferences(cellValue.slice(1))
            for (const ref of refs) {
                if (ref === startId) return true
                if (hasCircularReference(startId, ref, state, visited)) return true
            }
            return false
        }

        function computeValue(value, state, currentCellId) {
            if (typeof value !== 'string') return value
            if (!value.startsWith('=')) return value

            const formula = value.slice(1)
            const refs = getReferences(formula)

            // 1. Validar referencias inexistentes o fuera de rango (#REF!)
            for (const ref of refs) {
                const pos = parseCellId(ref)
                if (!pos || pos.x < 0 || pos.x >= COLUMNS || pos.y < 0 || pos.y >= ROWS) {
                    return '#REF!'
                }
            }

            // 2. Validar referencias circulares (#CIRCULAR!)
            if (currentCellId && hasCircularReference(currentCellId, currentCellId, state)) {
                return '#CIRCULAR!'
            }

            const constants = generateCellsConstants(state)

            let computedValue
            try {
                computedValue = eval(`(() => {
                    ${constants}
                    return ${formula};
                })()`)

                // 3. Validar división por cero (#DIV/0!)
                if (computedValue === Infinity || computedValue === -Infinity || Number.isNaN(computedValue)) {
                    return '#DIV/0!'
                }
            } catch(e) {
                // 4. Fórmula mal escrita (#ERROR!)
                return '#ERROR!'
            }
            return computedValue
        }

        function updateCell ({ x, y, value}) {
            const newState = structuredClone(STATE)
            const currentCellId = `${getColumn(x)}${y + 1}`

            newState[x][y].value = value
            newState[x][y].computedValue = computeValue(value, newState, currentCellId)

            computeAllCells(newState)
            STATE = newState

            renderSpreadSheet()
        }

        function generateCellsConstants (cells) {
            return cells.map ((rows, x) => {
                return rows.map ((cell, y) => {
                    const letter = getColumn(x)
                    const cellId = `${letter}${y + 1}`
                    const numericValue = typeof cell.computedValue === 'number' ? cell.computedValue : 0
                    return `const ${cellId} = ${numericValue};`
                }).join('\n')
            }).join('\n')
        }

        function computeAllCells(cells){
            // Dos pasadas para propagar actualizaciones de celdas compuestas
            for (let pass = 0; pass < 2; pass++) {
                cells.forEach((rows, x) => {
                    rows.forEach((cell, y) => {
                        const cellId = `${getColumn(x)}${y + 1}`
                        cell.computedValue = computeValue(cell.value, cells, cellId)
                    })
                })
            }
        }

        const renderSpreadSheet = () => {
            const headerHTML = `<tr>
                <th></th>
                ${times(COLUMNS).map(i => `<th>${getColumn(i)}</th>`).join('')}
                </tr>`
            $head.innerHTML = headerHTML

            const bodyHTML = times(ROWS).map(row => {
                return `<tr>
                <td>${row + 1}</td>
                ${times(COLUMNS).map(column => `
                <td data-x="${column}" data-y="${row}">
                    <span>${STATE[column][row].computedValue}</span>
                    <input type="text" value="${STATE[column][row].value}"/> 
                </td>
                `).join('')}
                </tr>`
            }).join('')
            
            $body.innerHTML = bodyHTML                  
        }

        $body.addEventListener('click', event => {
            const td = event.target.closest('td')
            if (!td) return

            const {x, y} = td.dataset
            const input = td.querySelector('input')
            
            const end = input.value.length
            input.setSelectionRange(end, end)
            input.focus()

            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') input.blur()
            })

            input.addEventListener('blur', () => {
                if (input.value === STATE[x][y].value) return
                updateCell({x: Number(x), y: Number(y), value: input.value})
            }, { once: true})
        })

        $head.addEventListener('click', event =>{
            const th = event.target.closest('th')
            if (!th) return

            const x = [ ... th.parentNode.children].indexOf(th)
            if (x <= 0) return

            selectedColumn = x - 1

            $$('.selected').forEach(el => el.classList.remove('selected'))

            th.classList.add('selected')
            $$(`tr td:nth-child(${x + 1})`).forEach (el => el.classList.add('selected'))
        })

        document.addEventListener('keydown', event => {
            if (event.key === 'Backspace' && selectedColumn !== null) {
                times(ROWS).forEach(row => {
                    updateCell({ x: selectedColumn, y: row, value: ''})
                })    
                renderSpreadSheet()
            }
        })

        document.addEventListener('copy', event => {
            if (selectedColumn !== null) {
                const columnValues = times(ROWS).map(row =>{
                    return STATE[selectedColumn][row].computedValue
                })

                event.clipboardData.setData('text/plain', columnValues.join('\n'))
                event.preventDefault()
            }
        })

        renderSpreadSheet()
    </script>
</head>
<body>

<table>
    <thead>
    </thead>
    <tbody>
    </tbody>
</table>
</body>
</html>
